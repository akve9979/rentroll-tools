[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "late-fee-calc"
version = "0.2.0"
description = "Late fee calculator for residential leases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maya Okafor" }]

[project.scripts]
latefee = "latefee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
